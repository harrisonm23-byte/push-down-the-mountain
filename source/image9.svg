<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Times New Roman, Times, serif" fill="#000">
  <rect width="1000" height="560" fill="#fff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#000"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker>
  </defs>

  <!-- ===== Left: the model as a stack of 48 layers ===== -->
  <text x="160" y="34" font-size="18" font-weight="bold" text-anchor="middle">The model: 48 layers in sequence</text>
  <text x="160" y="66" font-size="14" font-style="italic" text-anchor="middle">reply out</text>
  <line x1="160" y1="92" x2="160" y2="72" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/>

  <!-- 48 bars, 7.5px pitch: layer 48 at y=96, layer 1 at y=96+47*7.5=448.5 -->
  <g fill="#e4e4e4" stroke="#9a9a9a" stroke-width="0.6">
    <rect x="110" y="96" width="100" height="6.5"/><rect x="110" y="111" width="100" height="6.5"/><rect x="110" y="118.5" width="100" height="6.5"/><rect x="110" y="126" width="100" height="6.5"/><rect x="110" y="133.5" width="100" height="6.5"/><rect x="110" y="141" width="100" height="6.5"/><rect x="110" y="148.5" width="100" height="6.5"/><rect x="110" y="156" width="100" height="6.5"/><rect x="110" y="163.5" width="100" height="6.5"/><rect x="110" y="171" width="100" height="6.5"/><rect x="110" y="178.5" width="100" height="6.5"/><rect x="110" y="186" width="100" height="6.5"/><rect x="110" y="193.5" width="100" height="6.5"/><rect x="110" y="201" width="100" height="6.5"/><rect x="110" y="208.5" width="100" height="6.5"/><rect x="110" y="216" width="100" height="6.5"/><rect x="110" y="223.5" width="100" height="6.5"/><rect x="110" y="231" width="100" height="6.5"/><rect x="110" y="238.5" width="100" height="6.5"/><rect x="110" y="246" width="100" height="6.5"/><rect x="110" y="253.5" width="100" height="6.5"/><rect x="110" y="261" width="100" height="6.5"/><rect x="110" y="268.5" width="100" height="6.5"/><rect x="110" y="276" width="100" height="6.5"/><rect x="110" y="283.5" width="100" height="6.5"/><rect x="110" y="291" width="100" height="6.5"/><rect x="110" y="298.5" width="100" height="6.5"/><rect x="110" y="306" width="100" height="6.5"/><rect x="110" y="313.5" width="100" height="6.5"/><rect x="110" y="321" width="100" height="6.5"/><rect x="110" y="328.5" width="100" height="6.5"/><rect x="110" y="336" width="100" height="6.5"/><rect x="110" y="343.5" width="100" height="6.5"/><rect x="110" y="351" width="100" height="6.5"/><rect x="110" y="358.5" width="100" height="6.5"/><rect x="110" y="373.5" width="100" height="6.5"/><rect x="110" y="381" width="100" height="6.5"/><rect x="110" y="388.5" width="100" height="6.5"/><rect x="110" y="396" width="100" height="6.5"/><rect x="110" y="403.5" width="100" height="6.5"/><rect x="110" y="411" width="100" height="6.5"/><rect x="110" y="418.5" width="100" height="6.5"/><rect x="110" y="426" width="100" height="6.5"/><rect x="110" y="433.5" width="100" height="6.5"/><rect x="110" y="441" width="100" height="6.5"/><rect x="110" y="448.5" width="100" height="6.5"/>
  </g>
  <!-- layer 47 (y=103.5) and layer 12 (y=366) highlighted -->
  <rect x="110" y="103.5" width="100" height="6.5" fill="#000"/>
  <rect x="110" y="366" width="100" height="6.5" fill="#000"/>

  <text x="102" y="96" font-size="12.5" text-anchor="end">layer 48</text>
  <text x="102" y="111" font-size="13" font-weight="bold" text-anchor="end">layer 47</text>
  <text x="102" y="372" font-size="13" font-weight="bold" text-anchor="end">layer 12</text>
  <text x="102" y="455" font-size="12.5" text-anchor="end">layer 1</text>

  <line x1="160" y1="486" x2="160" y2="460" stroke="#000" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="160" y="506" font-size="14" font-style="italic" text-anchor="middle">text in: the history and UBS's request</text>
  <text x="160" y="540" font-size="12.5" fill="#333" text-anchor="middle">Early layers read the words; late layers settle what to do.</text>

  <!-- connectors from the two layers to their panels -->
  <path d="M212,369 C260,369 300,400 360,400" stroke="#000" stroke-width="1" fill="none" stroke-dasharray="4 3"/>
  <path d="M212,107 C260,107 300,150 360,150" stroke="#000" stroke-width="1" fill="none" stroke-dasharray="4 3"/>

  <!-- ===== Right top: layer 47 ===== -->
  <g transform="translate(362,40)">
    <rect x="0" y="0" width="608" height="225" fill="#fff" stroke="#000" stroke-width="1"/>
    <text x="14" y="26" font-size="16.5" font-weight="bold">At layer 47 (late): they point away from each other</text>
    <text x="14" y="47" font-size="13.5" font-style="italic">cosine −0.52, about 121° apart</text>
    <g transform="translate(225,195)">
      <circle r="3"/>
      <line x1="0" y1="0" x2="200" y2="0" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/>
      <text x="208" y="5" font-size="13.5">UBS's framing loss direction</text>
      <!-- 121°: (-0.515, 0.857); length 150 -->
      <line x1="0" y1="0" x2="-77" y2="-129" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ahr)"/>
      <text x="-236" y="-118" font-size="13.5" fill="#c0392b">management's loss direction</text>
      <path d="M55,0 A55,55 0 0 0 -28,-47" stroke="#000" stroke-width="1" fill="none"/>
      <text x="18" y="-56" font-size="12.5">121°</text>
    </g>
  </g>

  <!-- ===== Right bottom: layer 12 ===== -->
  <g transform="translate(362,285)">
    <rect x="0" y="0" width="608" height="225" fill="#fff" stroke="#000" stroke-width="1"/>
    <text x="14" y="26" font-size="16.5" font-weight="bold">At layer 12 (early): the two loss directions roughly agree</text>
    <text x="14" y="47" font-size="13.5" font-style="italic">cosine 0.59, about 54° apart</text>
    <g transform="translate(120,195)">
      <circle r="3"/>
      <line x1="0" y1="0" x2="200" y2="0" stroke="#000" stroke-width="2.5" marker-end="url(#ah)"/>
      <text x="208" y="5" font-size="13.5">UBS's framing loss direction</text>
      <!-- 54°: (cos54, sin54) = (0.588, 0.809); length 150 -->
      <line x1="0" y1="0" x2="88" y2="-121" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ahr)"/>
      <text x="96" y="-124" font-size="13.5" fill="#c0392b">management's loss direction</text>
      <path d="M55,0 A55,55 0 0 0 32,-44" stroke="#000" stroke-width="1" fill="none"/>
      <text x="60" y="-22" font-size="12.5">54°</text>
      <!-- reference 37°: (0.799, 0.602); length 185 -->
      <line x1="0" y1="0" x2="148" y2="-111" stroke="#888" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ahg)"/>
      <text x="156" y="-96" font-size="12" fill="#555">for scale: UBS's own direction, built from</text>
      <text x="156" y="-81" font-size="12" fill="#555">two halves of the episodes, cosine 0.80 (37°)</text>
    </g>
  </g>

  <text x="362" y="534" font-size="12.5" fill="#333">Each arrow is a direction in the model's internal state at that layer: the state after a loss-framed message</text>
  <text x="362" y="550" font-size="12.5" fill="#333">minus the state after a neutral one. Cosine 1 = same direction, 0 = unrelated, −1 = opposite.</text>
</svg>
